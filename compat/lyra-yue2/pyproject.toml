[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-yue2"
version = "0.1.0"
description = "Metadata-only alias so mlx-Yue@ab0f058 (dist renamed to mlx-yue) can resolve importlib.metadata.version('lyra-yue2')"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_yue2_compat"]
