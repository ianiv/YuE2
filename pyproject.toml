[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yue2-studio"
version = "0.1.0"
description = "Local YuE2 music-generation studio for Apple Silicon, built on mlx-Yue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-yue[transcription]",
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "python-multipart",
  "huggingface-hub",
  "psutil",
  "librosa",
]

[project.scripts]
yue2-studio = "yue2_studio.main:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.uv]
package = true

[tool.uv.sources]
# ianiv/mlx-Yue perf branch: vanch007/mlx-Yue 9253ed1 + pipelined AR decode, fused kernels, fast numerics.
mlx-yue = { git = "https://github.com/ianiv/mlx-Yue", rev = "dd80c47" }

[tool.hatch.build.targets.wheel]
packages = ["yue2_studio"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
