<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YuE2 Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23e3a33a%27/%3E%3Cpath d=%27M9 22V10l6 8 6-8v12%27 fill=%27none%27 stroke=%27%231b1305%27 stroke-width=%273%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Apply a remembered explicit theme before first paint (system = no stamp).
    try { var t = JSON.parse(localStorage.getItem("yue2.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.7.0/abcjs-basic-min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/create"><span class="brand-mark" aria-hidden="true"></span>YuE2 Studio</a>
      <nav class="main" aria-label="Main">
        <a href="#/create">Create</a>
        <a href="#/queue">Queue<span id="queue-count" class="badge-count" hidden></span></a>
        <a href="#/library">Library</a>
        <a href="#/cover">Cover</a>
        <a href="#/hum">Hum</a>
        <a href="#/settings">Settings</a>
      </nav>
      <span class="spacer"></span>
      <span id="engine-pill" class="pill" data-state="cold" title="Engine state"><span class="dot"></span><span class="txt">connecting…</span></span>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toasts" role="status"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
